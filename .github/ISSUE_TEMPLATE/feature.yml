name: Feature request
description: Propose a provider, screen, adapter, or hardware profile
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options: [Core model, Status provider, User interface, Linux adapter, Simulator, Hardware profile, Privileged action]
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and safety considerations
    validations:
      required: true
